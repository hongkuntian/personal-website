[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/resume"
to = "/hk_resume.pdf"
status = 301
force = true

[[redirects]]
from = "/resume/"
to = "/hk_resume.pdf"
status = 301
force = true

[[redirects]]
from = "/personal-website"
to = "/"
status = 301
force = true

[[redirects]]
from = "/personal-website/*"
to = "/:splat"
status = 301
force = true

# Retired design previews now lead to their canonical production pages.
[[redirects]]
from = "/redesigns/:design/projects/:slug"
to = "/projects/:slug/"
status = 301
force = true

[[redirects]]
from = "/redesigns/:design/archive"
to = "/archive/"
status = 301
force = true

[[redirects]]
from = "/redesigns/*"
to = "/"
status = 301
force = true
